spring.web.resources.static-locations=file:${user.dir}/uploads/
spring.mvc.static-path-pattern=/uploads/**

# MyBatis??
mybatis.type-aliases-package=org.example.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ??????
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# ??????
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduled-task-

# ???????????true?
schedule.enabled=${SCHEDULE_ENABLED:false}

# ????????
schedule.monthly-reminder.enabled=${MONTHLY_REMINDER_ENABLED:false}
schedule.monthly-reminder.cron=0 0 9 1 * ?
schedule.token-cleanup.enabled=${TOKEN_CLEANUP_ENABLED:false}
schedule.token-cleanup.cron=0 0 2 * * ?

server.servlet.context-path=/api

# School OAuth2.0 is off until the school-registered callback and credentials are configured.
# Keep the secret in the server environment; never add it to this file or a release archive.
sso.enabled=${SSO_ENABLED:false}
sso.client-id=${SSO_CLIENT_ID:}
sso.client-secret=${SSO_CLIENT_SECRET:}
sso.cas-base-url=${SSO_CAS_BASE_URL:http://ca.xzcit.cn/cas}
sso.redirect-uri=${SSO_REDIRECT_URI:}

logging.level.root=INFO
logging.level.BUSINESS=INFO
logging.level.org.springframework=INFO
logging.level.org.mybatis=INFO
logging.level.org.example=INFO
logging.file.name=logs/biz-backend.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%logger{20}] %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%logger{20}] %msg%n
